services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY must be set in .env}
      DD_SITE: ${DD_SITE:-datadoghq.eu}
    volumes:
      - ./otel-collector-datadog-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

