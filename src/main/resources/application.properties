spring.application.name=sqssender
spring.cloud.aws.region.static=${AWS_REGION:eu-west-1}

# SqsTemplate accepts a queue name or URL, not an ARN. A URL avoids an extra
# GetQueueUrl call and is therefore preferred for this PoC.
app.sqs.queue-url=${SQS_QUEUE_URL:https://sqs.eu-west-1.amazonaws.com/232100206199/xray-poc-queue}
